<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Purse</title>
    <style>
      :root {
        --bg: #fafafa;
        --card: #ffffff;
        --line: #e7e7e9;
        --text: #111113;
        --muted: #6b6b73;
        --soft: #f3f3f5;
        --ok: #12805c;
        --ok-bg: #e9f6f0;
        --warn: #a15c00;
        --warn-bg: #fdf3e3;
        --bad: #c4312b;
        --bad-bg: #fcebea;
        --accent: #111113;
        --radius: 12px;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d0d0f;
          --card: #151518;
          --line: #26262b;
          --text: #ededf0;
          --muted: #8e8e98;
          --soft: #1c1c20;
          --ok: #3ccf91;
          --ok-bg: #12261d;
          --warn: #e5a540;
          --warn-bg: #2a2112;
          --bad: #f06a63;
          --bad-bg: #2c1514;
          --accent: #ededf0;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 720px; margin: 0 auto; padding: 28px 20px 64px; }
      header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
      .brand { font-weight: 650; font-size: 18px; letter-spacing: -0.01em; }
      .brand span { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 14px; }
      .accounts { display: flex; gap: 6px; }
      .chip {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 13px;
        cursor: pointer;
      }
      .chip.active { border-color: var(--accent); }
      .chip small { color: var(--muted); margin-left: 6px; }
      .notice {
        background: var(--warn-bg);
        color: var(--warn);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 13px;
        margin-bottom: 16px;
        display: none;
      }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
      .card + .card { margin-top: 16px; }
      textarea {
        width: 100%;
        min-height: 96px;
        border: 0;
        outline: none;
        resize: vertical;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 16px;
      }
      textarea::placeholder { color: var(--muted); }
      .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
      .budget { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
      .budget input {
        width: 88px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
        color: var(--text);
        padding: 6px 8px;
        font: inherit;
        font-size: 14px;
      }
      button.run {
        background: var(--accent);
        color: var(--bg);
        border: 0;
        border-radius: 8px;
        padding: 9px 18px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.run:disabled { opacity: 0.4; cursor: default; }
      .examples { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
      .examples button {
        border: 0;
        background: var(--soft);
        color: var(--muted);
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 12.5px;
        cursor: pointer;
      }
      .balance { display: flex; align-items: baseline; gap: 8px; margin: 22px 2px 10px; }
      .balance strong { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
      .balance span { color: var(--muted); font-size: 13px; }
      .meter { height: 6px; background: var(--soft); border-radius: 999px; overflow: hidden; margin: 0 2px 6px; }
      .meter div { height: 100%; background: var(--ok); width: 100%; transition: width 0.4s ease; }
      .result { display: none; }
      .verdict { display: flex; gap: 12px; align-items: flex-start; }
      .badge { border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
      .badge.ok { background: var(--ok-bg); color: var(--ok); }
      .badge.warn { background: var(--warn-bg); color: var(--warn); }
      .badge.bad { background: var(--bad-bg); color: var(--bad); }
      .badge.run { background: var(--soft); color: var(--muted); }
      .verdict p { margin: 0; }
      .verdict .sub { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
      .answer { white-space: pre-wrap; margin: 16px 0 0; padding: 14px; background: var(--soft); border-radius: 8px; font-size: 14px; display: none; }
      ol.steps { list-style: none; padding: 0; margin: 18px 0 0; }
      ol.steps li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
      ol.steps li:first-child { border-top: 0; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
      .dot.running { background: var(--muted); animation: pulse 1s infinite; }
      .dot.done { background: var(--ok); }
      .dot.blocked { background: var(--bad); }
      .dot.skipped { background: var(--warn); }
      @keyframes pulse { 50% { opacity: 0.3; } }
      .steps .name { flex: 1; }
      .steps .why { color: var(--muted); font-size: 12.5px; }
      .steps .cost { color: var(--muted); font-family: var(--mono); font-size: 12.5px; }
      details { margin-top: 14px; }
      summary { color: var(--muted); font-size: 13px; cursor: pointer; }
      .log { margin-top: 10px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); max-height: 280px; overflow: auto; }
      .log div { padding: 3px 0; border-top: 1px dashed var(--line); }
      .history h3 { font-size: 13px; color: var(--muted); font-weight: 500; margin: 28px 2px 8px; }
      .history button {
        display: flex;
        width: 100%;
        justify-content: space-between;
        gap: 12px;
        background: none;
        border: 0;
        border-top: 1px solid var(--line);
        padding: 10px 2px;
        color: var(--text);
        font: inherit;
        font-size: 14px;
        text-align: left;
        cursor: pointer;
      }
      .history .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
      .history .s { white-space: nowrap; color: var(--muted); }
      @media (max-width: 520px) { .brand span { display: none; } }
      footer { margin-top: 36px; color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      footer button { background: none; border: 0; color: var(--muted); font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">Purse<span>AI that can't overspend</span></div>
        <div class="accounts" id="accounts"></div>
      </header>

      <div class="notice" id="testmode">Test mode. Nothing is charged.</div>

      <div class="card">
        <textarea id="task" placeholder="What do you need done?"></textarea>
        <div class="bar">
          <label class="budget">Budget $ <input id="bond" type="number" step="0.01" min="0" value="0.20" /></label>
          <button class="run" id="run">Run</button>
        </div>
        <div class="examples" id="examples">
          <button data-task="What does a USDC transfer on Base cost right now? Estimate the total for three transfers.">Gas cost on Base</button>
          <button data-task="Find the current ETH price and work out what 2.5 ETH is worth in USD.">ETH to USD</button>
        </div>
      </div>

      <div class="balance">
        <strong id="left">$0.00</strong><span id="of">left</span>
      </div>
      <div class="meter"><div id="meter"></div></div>

      <div class="card result" id="result">
        <div class="verdict">
          <span class="badge run" id="badge">Running</span>
          <div>
            <p id="headline">Working on it…</p>
            <p class="sub" id="sub"></p>
          </div>
        </div>
        <div class="answer" id="answer"></div>
        <ol class="steps" id="steps"></ol>
        <details>
          <summary>Details</summary>
          <div class="log" id="log"></div>
        </details>
      </div>

      <div class="history" id="history"></div>

      <footer>
        <span id="setup"></span>
        <button id="reset">Reset budgets</button>
      </footer>
    </div>

    <script>
      const STEPS = [
        ["guard", "Check the task"],
        ["policy", "Read the rules"],
        ["plan", "Plan"],
        ["research", "Search the web"],
        ["verify", "Check the numbers"],
        ["settle", "Review the answer"],
      ];

      // One plain sentence per way a run can end.
      const ENDINGS = {
        settlement_released: ["ok", "Done", "Finished within budget."],
        settlement_stopped: ["warn", "No answer", "No usable answer found. You only paid for what ran."],
        purse_guard: ["bad", "Blocked", "This task breaks a rule. The budget was taken."],
        otari_guardrail: ["bad", "Blocked", "Unsafe input was detected. The budget was taken."],
        purse_reserve: ["warn", "Out of budget", "Not enough left for the next step. Nothing more was spent."],
        otari_budget: ["warn", "Limit reached", "This account hit its spending limit."],
        error: ["bad", "Failed", "Something went wrong."],
      };

      const state = { user: "", source: null, code: "", accounts: [] };
      const $ = (id) => document.getElementById(id);
      const usd = (n) => "$" + Number(n || 0).toFixed(Number(n) > 0 && Number(n) < 0.01 ? 4 : 2);
      const exact = (n) => "$" + Number(n || 0).toFixed(5);
      const esc = (t) =>
        String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      try { state.code = sessionStorage.getItem("purse-code") || ""; } catch {}

      async function api(path, options = {}) {
        const headers = Object.assign({}, options.headers || {}, state.code ? { "x-purse-code": state.code } : {});
        const res = await fetch(path, Object.assign({}, options, { headers }));
        if (res.status === 401) {
          const code = window.prompt("Enter your access code");
          if (code) {
            state.code = code.trim();
            try { sessionStorage.setItem("purse-code", state.code); } catch {}
            return api(path, options);
          }
        }
        return res;
      }

      async function loadState() {
        const res = await api("/api/state");
        if (!res.ok) return;
        const data = await res.json();
        state.accounts = data.accounts;
        if (!state.user && data.accounts[0]) state.user = data.accounts[0].id;

        $("testmode").style.display = data.mock ? "block" : "none";
        $("setup").textContent =
          (data.guardrailProfile ? "Safety check on" : "Safety check off") + " · Runs on open models via Otari";

        const box = $("accounts");
        box.innerHTML = "";
        for (const account of data.accounts) {
          const chip = document.createElement("button");
          chip.className = "chip" + (account.id === state.user ? " active" : "");
          chip.innerHTML = esc(account.label) + (account.hasKey || data.mock ? "" : "<small>no key</small>");
          chip.onclick = () => { state.user = account.id; loadState(); };
          box.appendChild(chip);
        }

        const current = data.accounts.find((account) => account.id === state.user);
        if (current) {
          $("left").textContent = usd(current.remainingUsd);
          $("of").textContent = "left of " + usd(current.bondUsd);
          const pct = current.bondUsd > 0 ? (current.remainingUsd / current.bondUsd) * 100 : 0;
          $("meter").style.width = Math.max(0, Math.min(100, pct)) + "%";
          $("meter").style.background = pct < 15 ? "var(--bad)" : pct < 40 ? "var(--warn)" : "var(--ok)";
          if (document.activeElement !== $("bond")) $("bond").value = current.bondUsd.toFixed(2);
        }

        const runs = (data.runs || []).filter((run) => run.verdict !== "running");
        const history = $("history");
        history.innerHTML = runs.length ? "<h3>Recent</h3>" : "";
        for (const run of runs) {
          const [, title] = ending(run);
          const item = document.createElement("button");
          item.innerHTML = '<span class="t">' + esc(run.task) + "</span><span class=\"s\">" + esc(title) + " · " + usd(run.spentUsd) + "</span>";
          item.onclick = () => open(run.runId);
          history.appendChild(item);
        }
      }

      function ending(outcome) {
        if (outcome.endedBy === "settlement") return ENDINGS["settlement_" + outcome.verdict] || ENDINGS.error;
        return ENDINGS[outcome.endedBy] || ENDINGS.error;
      }

      function resetResult() {
        $("result").style.display = "block";
        $("badge").className = "badge run";
        $("badge").textContent = "Running";
        $("headline").textContent = "Working on it…";
        $("sub").textContent = "";
        $("answer").style.display = "none";
        $("log").innerHTML = "";
        $("steps").innerHTML = "";
        for (const [key, label] of STEPS) {
          const li = document.createElement("li");
          li.id = "step-" + key;
          li.innerHTML = '<span class="dot"></span><span class="name">' + label + '</span><span class="why"></span><span class="cost"></span>';
          $("steps").appendChild(li);
        }
      }

      function onEvent(event) {
        const li = $("step-" + event.stage);
        if (li) {
          const dot = li.querySelector(".dot");
          if (event.status === "start") dot.className = "dot running";
          if (event.status === "ok") dot.className = "dot done";
          if (event.status === "refused" || event.status === "error") dot.className = "dot blocked";
          if (event.status === "ok" && event.costUsd !== undefined) li.querySelector(".cost").textContent = exact(event.costUsd);
          if (event.fallback) li.querySelector(".why").textContent = "backup model";
        }
        const line = document.createElement("div");
        line.textContent =
          event.stage + " · " + event.status +
          (event.servedModel || event.requestedModel ? " · " + (event.servedModel || event.requestedModel) : "") +
          (event.costUsd !== undefined ? " · " + exact(event.costUsd) + (event.estimated ? " est." : "") : "") +
          (event.note ? " · " + event.note : "");
        $("log").appendChild(line);
      }

      function onDone(outcome) {
        const [tone, title, sentence] = ending(outcome);
        $("badge").className = "badge " + tone;
        $("badge").textContent = title;
        $("headline").textContent = sentence;
        $("sub").textContent = "Spent " + exact(outcome.spentUsd) + (tone === "ok" ? "" : outcome.reason ? " · " + outcome.reason : "");
        for (const li of $("steps").children) {
          const dot = li.querySelector(".dot");
          if (dot.className === "dot" || dot.className === "dot running") {
            dot.className = "dot skipped";
            li.querySelector(".why").textContent = li.querySelector(".why").textContent || "skipped";
          }
        }
        if (outcome.answer && outcome.verdict === "released") {
          $("answer").textContent = outcome.answer;
          $("answer").style.display = "block";
        }
        $("run").disabled = false;
        loadState();
      }

      function open(runId) {
        resetResult();
        if (state.source) state.source.close();
        state.source = new EventSource("/api/stream/" + runId + (state.code ? "?code=" + encodeURIComponent(state.code) : ""));
        state.source.onmessage = (message) => {
          const payload = JSON.parse(message.data);
          if (payload.type === "event") onEvent(payload.event);
          if (payload.type === "done") { state.source.close(); onDone(payload.outcome); }
        };
      }

      async function start() {
        const task = $("task").value.trim();
        if (!task || !state.user) return;
        $("run").disabled = true;
        const bondUsd = Number($("bond").value);
        await api("/api/bond", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user: state.user, bondUsd: Number.isFinite(bondUsd) && bondUsd >= 0 ? bondUsd : 0.2 }),
        });
        const res = await api("/api/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user: state.user, task }),
        });
        const data = await res.json();
        if (!res.ok) {
          resetResult();
          $("badge").className = "badge bad";
          $("badge").textContent = "Not started";
          $("headline").textContent = data.error || "The run could not start.";
          $("steps").innerHTML = "";
          $("run").disabled = false;
          return;
        }
        await loadState();
        open(data.runId);
      }

      $("run").onclick = start;
      $("task").addEventListener("keydown", (event) => {
        if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) start();
      });
      $("reset").onclick = async () => { await api("/api/reset", { method: "POST" }); loadState(); };
      for (const button of $("examples").querySelectorAll("[data-task]")) {
        button.onclick = () => { $("task").value = button.getAttribute("data-task"); $("task").focus(); };
      }
      loadState();
    </script>
  </body>
</html>
